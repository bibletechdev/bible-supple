<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みことばAR（限定版・3D） ─ ヨハネ 11:25</title>
<!-- 空間に置くタイプのAR。Android=Scene Viewer / iPhone=Quick Look を自動で使い分ける。アプリ不要 -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root{--bg:#f7f4ee;--ink:#2b2a27;--gold:#b48a3c}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;padding:16px}
  main{max-width:520px;margin:0 auto;text-align:center}
  model-viewer{width:100%;height:60vh;max-height:520px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  h1{font-size:1.1rem;font-weight:500;letter-spacing:.1em;margin:20px 0 6px}
  blockquote{margin:12px 0;line-height:1.9;font-size:1.05rem}
  cite{display:block;font-size:.85rem;color:#777;font-style:normal;margin-top:4px}
  .ar-btn{background:var(--gold);color:#fff;border:0;border-radius:999px;padding:12px 26px;font-size:1rem;position:absolute;bottom:16px;left:50%;transform:translateX(-50%)}
  audio{width:100%;margin-top:14px}
  small{color:#888;display:block;margin-top:20px;font-size:.75rem}
</style>
</head>
<body>
<main>
  <model-viewer
    src="models/cross.glb"
    ar ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    camera-controls auto-rotate
    shadow-intensity="1" exposure="1.1"
    alt="十字架の3Dモデル">
    <button slot="ar-button" class="ar-btn">目の前に置いて見る (AR)</button>
  </model-viewer>

  <h1>みことば</h1>
  <blockquote id="verse">
    わたしはよみがえりであり、命である。<br>わたしを信じる者は、たとい死んでも生きる。
    <cite>ヨハネによる福音書 11:25（口語訳）</cite>
  </blockquote>

  <!-- ナレーター朗読 + BGM をミックスした mp3 を置く -->
  <audio id="voice" controls preload="none" src="audio/john-11-25.mp3">お使いのブラウザは音声再生に対応していません</audio>

  <small>このカードは、売上の10%を教会に献金しています。</small>
</main>
<script src="verses.js"></script>
<script>
  // ?v=<id> で聖句本文・音声・(あれば) models/<id>.glb を切り替える。未指定は john-11-25
  const id = new URLSearchParams(location.search).get('v') || 'john-11-25';
  const v  = VERSES.find(x => x.id === id);
  if (v) {
    document.title = `みことばAR（限定版・3D） ─ ${v.ref}`;
    const q = document.getElementById('verse');
    q.textContent = v.text;
    const c = document.createElement('cite'); c.textContent = `${v.ref}（口語訳）`; q.appendChild(c);
    document.getElementById('voice').src = `audio/${v.id}.mp3`;
    const mv = document.querySelector('model-viewer');
    fetch(`models/${v.id}.glb`, {method:'HEAD'}).then(r => { if (r.ok) mv.src = `models/${v.id}.glb`; }).catch(()=>{});
  }
</script>
</body>
</html>
