<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みことばカード 印刷用</title>
<!--
  印刷入稿用。ブラウザの「印刷 → PDFに保存」で、1ページ = 1枚（100×148mm）のPDFになる。
  ・print.html                                 … 表面100枚
  ・print.html?back=1&base=<公開URL>           … 表・裏（QRコード）を交互に
  ・print.html?only=back&base=<公開URL>        … 裏面だけ
  ・print.html?ids=john-11-25,john-3-16        … 指定したカードだけ
  印刷設定：用紙サイズ「100×148mm（はがき）」、余白「なし」、「背景のグラフィック」をオン。
  塗り足しが必要な印刷所の場合は ?bleed=3 で四辺に3mm足した 106×154mm にする。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cards.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{ --w:100mm; --h:148mm; }
  *{box-sizing:border-box}
  body{margin:0; background:#555; font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .toolbar{position:sticky; top:0; z-index:9; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 16px; background:#1b1b1b; color:#eee; font-size:13px}
  .toolbar button{padding:6px 14px; border-radius:6px; border:0; background:#e2c275; font-weight:700; cursor:pointer}
  .toolbar code{background:#333; padding:2px 6px; border-radius:4px}
  .sheet{width:var(--w); height:var(--h); margin:10mm auto; background:#fff; overflow:hidden; position:relative; page-break-after:always; break-after:page; box-shadow:0 4px 20px rgba(0,0,0,.4)}
  .sheet .mc{width:100%; height:100%; aspect-ratio:auto}
  .sheet .mc-face{border-radius:0}
  .sheet .mc-back{display:none}
  .back .one{text-wrap:balance}

  /* 裏面（QR） */
  .back{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6mm; padding:14mm 12mm; text-align:center; color:#2a2622;
    background:radial-gradient(circle at 50% 30%, #fffaf0, #f4ecdc)}
  .back .edge{position:absolute; inset:5mm; border:.4mm solid #c9a14c; border-radius:3mm; pointer-events:none}
  .back .edge::after{content:""; position:absolute; inset:1.2mm; border:.2mm solid rgba(201,161,76,.6); border-radius:2mm}
  .back .en{font-family:Cinzel,serif; letter-spacing:.5em; font-size:2.6mm; color:#b48a3c}
  .back h2{margin:0; font-size:6mm; letter-spacing:.14em; font-weight:800}
  .back .ref{font-size:3.2mm; color:#7a6a50; letter-spacing:.08em}
  .back .qr{width:38mm; height:38mm; padding:2.5mm; background:#fff; border-radius:2mm; box-shadow:0 0 0 .3mm #e6dcc6}
  .back .qr svg{width:100%; height:100%; display:block}
  .back .how{font-size:3.3mm; line-height:1.8}
  .back .one{font-size:3.6mm; line-height:1.9; margin:0}
  .back .foot{position:absolute; bottom:9mm; left:0; right:0; font-size:2.6mm; color:#8a8177; letter-spacing:.06em; line-height:1.8}
  .back .no{position:absolute; top:9mm; right:10mm; font-family:Cinzel,serif; font-size:2.8mm; color:#b48a3c}

  @page{ size:var(--w) var(--h); margin:0 }
  @media print{
    body{background:none}
    .toolbar{display:none}
    .sheet{margin:0; box-shadow:none}
  }
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<div id="out"></div>

<script src="verses.js"></script>
<script src="icons.js"></script>
<script src="cards.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const bleed = parseFloat(q.get("bleed") || "0");
  const base = (q.get("base") || location.href.replace(/print\.html.*$/, "")).replace(/\/?$/, "/");
  const mode = q.get("only") || (q.get("back") ? "both" : "front");
  const ids = q.get("ids") ? q.get("ids").split(",") : null;
  const list = ids ? VERSES.filter((v) => ids.includes(v.id)) : VERSES;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // はがき用紙サイズ（@page は CSS 変数を読まないので、ここで書き込む）
  const W = 100 + bleed * 2, H = 148 + bleed * 2;
  document.documentElement.style.setProperty("--w", W + "mm");
  document.documentElement.style.setProperty("--h", H + "mm");
  const page = document.createElement("style");
  page.textContent = `@page{ size:${W}mm ${H}mm; margin:0 }`;
  document.head.appendChild(page);

  document.getElementById("toolbar").innerHTML = `
    <button onclick="print()">印刷 / PDFに保存</button>
    <span>${list.length}枚 ・ ${mode === "front" ? "表面のみ" : mode === "back" ? "裏面のみ" : "表裏"} ・ ${W}×${H}mm</span>
    <span>QRの飛び先：<code>${esc(base)}?v=…</code></span>
    <span>余白なし・背景のグラフィックをオンで印刷</span>`;

  const out = document.getElementById("out");
  const qrSVG = (url) => {
    if (typeof qrcode !== "function") return "<p>QRライブラリを読み込めませんでした</p>";
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    return qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  };

  for (const v of list) {
    if (mode !== "back") {
      const s = document.createElement("section");
      s.className = "sheet";
      s.appendChild(MC.render(v));
      out.appendChild(s);
    }
    if (mode !== "front") {
      const url = `${base}?v=${v.id}`;
      const s = document.createElement("section");
      s.className = "sheet back";
      s.innerHTML = `
        <div class="edge"></div>
        <span class="no">No.${MC.pad(v.no)}</span>
        <span class="en">MIKOTOBA CARD</span>
        <h2>${esc(v.title)}</h2>
        <span class="ref">${esc(v.ref)}</span>
        <div class="qr">${qrSVG(url)}</div>
        <div class="how">QRコードを読むと<br>このみことばの朗読が聞けます</div>
        <p class="one">${esc(v.one)}</p>
        <div class="foot">売上の10%を教会に献金しています<br>聖書本文：口語訳</div>`;
      out.appendChild(s);
    }
  }
  const refit = () => document.querySelectorAll(".mc").forEach(MC.fit);
  requestAnimationFrame(refit);
  if (document.fonts) document.fonts.ready.then(refit);
})();
</script>
</body>
</html>
