<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>御言葉サプリ | 心の処方箋</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f9f7f2;
            --card-bg: #ffffff;
            --text-color: #5d5548;
            --primary-color: #8ba382;
            --accent-color: #d4a373;
            --shadow: 0 4px 15px rgba(93, 85, 72, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; justify-content: center; align-items: center;
            min-height: 100dvh;
            overscroll-behavior: none;
            background-image: radial-gradient(#e8e4dc 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container {
            width: 92%;
            max-width: 420px;
            background-color: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 
                0 10px 25px rgba(93, 85, 72, 0.05),
                0 0 0 5px rgba(255, 255, 255, 0.5);
            text-align: center;
            display: flex; flex-direction: column; 
            gap: 2vh;
            height: 92dvh;
            max-height: 850px;
            justify-content: space-evenly;
            border: 1px solid #efebe4;
        }

        header h1 {
            font-family: 'Kiwi Maru', serif;
            font-size: 1.6rem;
            color: var(--primary-color);
            margin: 0;
            letter-spacing: 0.05em;
        }

        header p { 
            font-size: 0.8rem; 
            color: #9c9488; 
            margin-top: 5px; 
            font-family: 'Kiwi Maru', serif;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            height: 50px;
            margin: 0 auto;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            height: 100%;
            padding: 0 15px;
            border: 2px solid #efebe4;
            border-radius: 25px;
            font-size: 1rem; 
            outline: none;
            transition: border-color 0.3s;
            background: #faf9f6;
            color: var(--text-color);
            font-family: 'Zen Maru Gothic', sans-serif;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            background: #fff;
        }

        .search-btn-icon {
            flex-shrink: 0;
            width: 50px; 
            height: 50px;
            border-radius: 50%;
            background: var(--primary-color);
            border: none;
            display: flex; 
            justify-content: center; 
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(139, 163, 130, 0.2);
            padding: 0;
        }
        
        .search-btn-icon svg { 
            width: 24px; 
            height: 24px; 
            fill: white;
            display: block;
        }

        .tags-container {
            display: flex; flex-direction: column;
            gap: 12px;
        }
        .tags-label { 
            font-size: 0.85rem; color: #8d8579; 
            font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .tags-label::before, .tags-label::after {
            content: ""; flex: 1; height: 1px; background: #e0dcd5; max-width: 40px;
        }

        .tags { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        .tag {
            padding: 12px 5px; border-radius: 12px;
            font-size: 0.8rem; font-weight: 500;
            cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            background: #f4f1ea; color: #6b6357; border: 1px solid transparent;
        }
        .tag:active { transform: scale(0.96); }
        .tag.mental { background: #eef5f6; color: #5a7d85; }
        .tag.work { background: #fdf5e6; color: #9c7c56; }
        .tag.relation { background: #fbedee; color: #b06d7b; }
        .tag.self { background: #f3eff5; color: #8a7b92; }
        .tag.future { background: #edf5ea; color: #6d8a68; }
        .tag.life { background: #fff8e1; color: #a68b42; }

        .main-btn {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, #9cb892 0%, #8ba382 100%);
            color: white; border: none; border-radius: 50px;
            font-size: 1.1rem; font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(139, 163, 130, 0.3);
            transition: 0.2s;
            font-family: 'Zen Maru Gothic', sans-serif;
        }
        .main-btn:active { transform: scale(0.98); }

        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(93, 85, 72, 0.4);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden;
            transition: 0.4s ease; z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-card {
            background: #fffcf7;
            width: 88%; max-width: 380px;
            padding: 40px 20px;
            border-radius: 15px;
            text-align: center;
            opacity: 0;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            position: relative;
            border: 1px solid #eae6df;
            z-index: 1;
        }
        .modal-card::before {
            content: ""; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px dashed #dcd6cb; border-radius: 10px; pointer-events: none;
        }
        /* カードの表示はJSアニメーションで制御 */

        .verse-icon { font-size: 2.8rem; margin-bottom: 15px; display: block; opacity: 0; color: var(--primary-color); }
        .verse-text {
            font-family: 'Kiwi Maru', serif; font-size: 1.25rem; line-height: 1.9;
            color: #4a4238; margin-bottom: 20px; font-weight: 500; opacity: 0;
        }
        .verse-ref { font-size: 0.9rem; color: #888; display: block; margin-bottom: 30px; font-weight: bold; opacity: 0; }

        .share-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; opacity: 0; position: relative; z-index: 2; }
        .share-btn { width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; background: #f0ece6; }
        .share-btn:active { transform: scale(0.92); }
        .share-btn svg { width: 24px; height: 24px; fill: #888; }
        .share-btn.line svg { fill: #00b900; }
        .share-btn.x svg { fill: #333; }

        .close-btn { background: transparent; color: #8d8579; border: 1px solid #dcd6cb; padding: 12px 30px; border-radius: 30px; font-size: 0.9rem; cursor: pointer; font-weight: bold; position: relative; z-index: 2; }

        .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(93, 85, 72, 0.95); color: #fffcf7; padding: 12px 24px; border-radius: 50px; font-size: 0.85rem; opacity: 0; visibility: hidden; transition: 0.3s; z-index: 2000; }
        .toast.show { opacity: 1; visibility: visible; }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(10px); filter: blur(2px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .animate-in { animation: floatUp 0.8s forwards; }

        /* ── 天から舞い降りる演出 ── */
        @keyframes fallFromHeaven {
            0%   { opacity: 0;    transform: translateY(-100vh) rotate(-8deg) scale(0.8);  filter: blur(8px) brightness(3); }
            25%  { opacity: 0.15; transform: translateY(-55vh)  rotate(-5deg) scale(0.87); filter: blur(5px) brightness(2.2); }
            50%  { opacity: 0.6;  transform: translateY(-10vh)  rotate(-1deg) scale(0.97); filter: blur(1px) brightness(1.5); }
            65%  { opacity: 0.9;  transform: translateY(14px)   rotate(1.2deg) scale(1.04); filter: blur(0)  brightness(1.3); }
            78%  { opacity: 1;    transform: translateY(-6px)   rotate(-0.4deg) scale(0.99); filter: brightness(1.1); }
            88%  { transform: translateY(3px)  rotate(0.2deg) scale(1.01); }
            100% { opacity: 1;    transform: translateY(0)      rotate(0deg)   scale(1);    filter: brightness(1); }
        }
        @keyframes landGlow {
            0%   { box-shadow: 0 0 55px 22px rgba(255,235,130,0.95), 0 0 110px 50px rgba(255,210,60,0.45); }
            45%  { box-shadow: 0 0 75px 35px rgba(255,235,130,0.55), 0 0 140px 70px rgba(255,210,60,0.2); }
            100% { box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        }
        @keyframes rayPulse {
            0%   { opacity: 0.85; transform: scale(0.25); }
            55%  { opacity: 0.4; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(1.6); }
        }
        @keyframes shineSweep {
            from { left: -80%; }
            to   { left: 130%; }
        }
        @keyframes particleFly {
            0%   { transform: translate(0,0) scale(1); opacity: 1; }
            80%  { opacity: 0.6; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.1); opacity: 0; }
        }

        .heaven-rays {
            position: absolute;
            width: 520px; height: 520px;
            left: 50%; top: 50%;
            margin-left: -260px; margin-top: -260px;
            background: conic-gradient(
                rgba(255,240,140,0.28) 0deg,   transparent 10deg,
                rgba(255,240,140,0.20) 20deg,  transparent 30deg,
                rgba(255,240,140,0.25) 40deg,  transparent 50deg,
                rgba(255,240,140,0.18) 60deg,  transparent 70deg,
                rgba(255,240,140,0.28) 80deg,  transparent 90deg,
                rgba(255,240,140,0.20) 100deg, transparent 110deg,
                rgba(255,240,140,0.25) 120deg, transparent 130deg,
                rgba(255,240,140,0.18) 140deg, transparent 150deg,
                rgba(255,240,140,0.28) 160deg, transparent 170deg,
                rgba(255,240,140,0.20) 180deg, transparent 190deg,
                rgba(255,240,140,0.25) 200deg, transparent 210deg,
                rgba(255,240,140,0.18) 220deg, transparent 230deg,
                rgba(255,240,140,0.28) 240deg, transparent 250deg,
                rgba(255,240,140,0.20) 260deg, transparent 270deg,
                rgba(255,240,140,0.25) 280deg, transparent 290deg,
                rgba(255,240,140,0.18) 300deg, transparent 310deg,
                rgba(255,240,140,0.28) 320deg, transparent 330deg,
                rgba(255,240,140,0.20) 340deg, transparent 350deg,
                rgba(255,240,140,0.25) 360deg
            );
            border-radius: 50%;
            pointer-events: none; z-index: 0;
            opacity: 0; transform-origin: center;
        }
        .card-shine-wrap {
            position: absolute; inset: 0; overflow: hidden;
            border-radius: 15px; pointer-events: none; z-index: 15;
        }
        .card-shine {
            position: absolute; top: 0; bottom: 0; left: -80%; width: 50%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.65), transparent);
            transform: skewX(-15deg);
            animation: shineSweep 0.65s ease-in-out forwards;
            pointer-events: none;
        }
        .particle {
            position: absolute; border-radius: 50%;
            pointer-events: none; z-index: 1001;
            animation: particleFly 0.8s ease-out forwards;
        }

        .gacha-badge {
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #d4a373, #e9c46a);
            color: white; font-size: 0.7rem; font-weight: bold;
            padding: 4px 16px; border-radius: 20px; white-space: nowrap;
            box-shadow: 0 3px 8px rgba(212,163,115,0.4);
            letter-spacing: 0.05em; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active .gacha-badge { opacity: 1; }

        /* ── 音読ボタン ── */
        .speak-row {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-bottom: 4px; opacity: 0;
        }
        .speak-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: #f0ece6; border: 2px solid #e0dcd5;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: 0.25s; flex-shrink: 0;
        }
        .speak-btn svg { width: 20px; height: 20px; fill: #8d8579; transition: fill 0.2s; }
        .speak-btn.speaking { background: #eef5f0; border-color: var(--primary-color); }
        .speak-btn.speaking svg { fill: var(--primary-color); }
        .speak-btn:active { transform: scale(0.92); }
        .speak-label { font-size: 0.8rem; color: #9c9488; }

        .footer { font-size: 0.65rem; color: #b0a99f; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>御言葉サプリ 🌿</h1>
            <p>今の気分や悩みに効く言葉を処方します</p>
        </header>

        <div class="search-box">
            <input type="text" id="userInput" placeholder="例：疲れた、眠れない..." onkeypress="handleKeyPress(event)">
            <button class="search-btn-icon" onclick="performKeywordSearch()">
                <svg viewBox="0 0 24 24"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" /></svg>
            </button>
        </div>

        <div class="tags-container">
            <div class="tags-label">カテゴリから選ぶ</div>
            <div class="tags">
                <div class="tag mental" onclick="filterByCategory('mental')">☁️ メンタル</div>
                <div class="tag work" onclick="filterByCategory('work')">💼 お仕事</div>
                <div class="tag relation" onclick="filterByCategory('relation')">🤝 人間関係</div>
                <div class="tag self" onclick="filterByCategory('self')">🪞 自分自身</div>
                <div class="tag future" onclick="filterByCategory('future')">✨ 将来・決断</div>
                <div class="tag life" onclick="filterByCategory('life')">💸 お金・試練</div>
            </div>
        </div>

        <button class="main-btn" onclick="searchRandom()">おまかせで表示</button>
        
        <div class="footer">© 2026 Tech Bible Note</div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="heaven-rays" id="heavenRays"></div>
        <div class="modal-card">
            <div class="gacha-badge" id="gachaBadge"></div>
            <span class="verse-icon">🌿</span>
            <div class="verse-text" id="modalText"></div>
            <span class="verse-ref" id="modalRef"></span>
            <div class="speak-row" id="speakRow">
                <button class="speak-btn" id="speakBtn" onclick="speakVerse()" title="音読する">
                    <svg viewBox="0 0 24 24"><path d="M3,9V15H7L12,20V4L7,9H3M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18.01,19.86 21,16.28 21,12C21,7.72 18.01,4.14 14,3.23Z"/></svg>
                </button>
                <span class="speak-label">音読する</span>
            </div>
            <div class="share-container" id="shareButtons">
                <button class="share-btn copy" onclick="shareAction('copy')" title="コピー">
                    <svg viewBox="0 0 24 24"><path d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z" /></svg>
                </button>
                <button class="share-btn x" onclick="shareAction('x')" title="Xでシェア">
                    <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </button>
                <button class="share-btn line" onclick="shareAction('line')" title="LINEで送る">
                    <svg viewBox="0 0 24 24"><path d="M22,10.8C22,5.9 17.5,2 12,2C6.5,2 2,5.9 2,10.8C2,14.8 4.7,18.3 8.6,19.3C9.1,19.4 9.4,19.7 9.3,20.2C9.3,20.2 9.1,21.3 9.1,21.4C9,21.8 9,22 9.3,22.1C9.6,22.1 10,21.9 10.2,21.8C10.2,21.8 15.3,18.4 15.3,18.4C19.4,16.5 22,13.8 22,10.8M12,14C11.4,14 11,13.6 11,13V9C11,8.4 11.4,8 12,8C12.6,8 13,8.4 13,9V13C13,13.6 12.6,14 12,14M8.5,14H6.5C5.9,14 5.5,13.6 5.5,13V9C5.5,8.4 5.9,8 6.5,8H8.5C9.1,8 9.5,8.4 9.5,9V13C9.5,13.6 9.1,14 8.5,14M17.5,14H15.5C14.9,14 14.5,13.6 14.5,13V9C14.5,8.4 14.9,8 15.5,8H17.5C18.1,8 18.5,8.4 18.5,9V13C18.5,13.6 18.1,14 17.5,14Z"/></svg>
                </button>
            </div>
            <button class="close-btn" onclick="closeModalButton()">閉じる</button>
        </div>
    </div>

    <div class="toast" id="toast">コピーしました！</div>

    <script>
        const bibleVerses = [
  { "category": "mental", "keywords": ["不安", "明日", "心配"], "text": "明日のことまで心配しなくてよいのです。明日のことは明日が心配します。", "ref": "マタイ 6:34" },
  { "category": "mental", "keywords": ["重荷", "疲れ", "休み"], "text": "すべて、疲れた人、重荷を負っている人は、わたしのところに来なさい。わたしがあなたがたを休ませてあげます。", "ref": "マタイ 11:28" },
  { "category": "mental", "keywords": ["恐れ", "価値", "大切"], "text": "恐れることはありません。あなたがたは、たくさんの雀よりもすぐれた者です。", "ref": "マタイ 10:31" },
  { "category": "mental", "keywords": ["平和", "混乱", "落ち着き"], "text": "神は混乱の神ではなく、平和の神だからです。", "ref": "1コリント 14:33" },
  { "category": "mental", "keywords": ["慰め", "苦しみ", "支え"], "text": "神は、私たちのあらゆる苦しみのときに、私たちを慰めてくださいます。", "ref": "2コリント 1:4" },
  { "category": "mental", "keywords": ["弱さ", "恵み", "肯定"], "text": "「わたしの恵みは、あなたに十分である。わたしの力は、弱さのうちに完全に現れるからである。」", "ref": "2コリント 12:9" },
  { "category": "mental", "keywords": ["平安", "守り", "思考"], "text": "すべての理解を超えた神の平安が、あなたがたの心と思いをキリスト・イエスにあって守ってくれます。", "ref": "ピリピ 4:7" },
  { "category": "mental", "keywords": ["思い煩い", "祈り", "感謝"], "text": "何も思い煩わないで、あらゆる場合に感謝をもって祈り、願い事を神に知っていただきなさい。", "ref": "ピリピ 4:6" },
  { "category": "mental", "keywords": ["孤独", "味方", "強さ"], "text": "神が私たちの味方であるなら、だれが私たちに敵対できるでしょう。", "ref": "ローマ 8:31" },
  { "category": "mental", "keywords": ["心", "穏やか", "霊"], "text": "御霊の思いは、いのちと平安です。", "ref": "ローマ 8:6" },
  { "category": "mental", "keywords": ["勇気", "恐れ", "愛"], "text": "神が与えてくださったものは、おくびょうの霊ではなく、力と愛と慎みの霊です。", "ref": "2テモテ 1:7" },
  { "category": "mental", "keywords": ["心配", "ゆだねる", "重荷"], "text": "あなたがたの思い煩いを、いっさい神にゆだねなさい。神があなたがたのことを心配してくださるからです。", "ref": "1ペテロ 5:7" },
  { "category": "mental", "keywords": ["愛", "恐れ", "安心"], "text": "愛には恐れがありません。全き愛は恐れを締め出します。", "ref": "1ヨハネ 4:18" },
  { "category": "mental", "keywords": ["自分を責める", "良心", "赦し"], "text": "たとい私たちの心が責めたとしても、神は私たちの心よりも大きく、すべてをご存じです。", "ref": "1ヨハネ 3:20" },
  { "category": "mental", "keywords": ["動揺", "信じる", "心"], "text": "あなたがたは心を騒がせてはいけません。神を信じ、またわたしを信じなさい。", "ref": "ヨハネ 14:1" },
  { "category": "mental", "keywords": ["平安", "残す", "贈り物"], "text": "わたしは、あなたがたに平安を残します。わたしは、あなたがたにわたしの平安を与えます。", "ref": "ヨハネ 14:27" },
  { "category": "mental", "keywords": ["喜び", "満たされる", "元気"], "text": "わたしの喜びがあなたがたのうちにあり、喜びが満たされるようになるためです。", "ref": "ヨハネ 15:11" },
  { "category": "mental", "keywords": ["勝利", "勇気", "世"], "text": "あなたがたは世にあっては患難があります。しかし勇気を出しなさい。わたしはすでに世に勝っているのです。", "ref": "ヨハネ 16:33" },
  { "category": "mental", "keywords": ["安心", "助け", "恐れない"], "text": "主は私を助けてくださる。私は恐れない。人が私に何ができようか。", "ref": "ヘブル 13:6" },
  { "category": "mental", "keywords": ["悩み", "迷い", "二心"], "text": "心が定まらないために、その歩みのすべてに動揺する人です。", "ref": "ヤコブ 1:8" },
  { "category": "work", "keywords": ["光", "良い行い", "模範"], "text": "あなたがたの光を人々の前で輝かせ、人々があなたがたの良い行いを見て、天の父をあがめるようにしなさい。", "ref": "マタイ 5:16" },
  { "category": "work", "keywords": ["報い", "隠れたこと", "評価"], "text": "隠れた所を見ておられるあなたの父が、あなたに報いてくださいます。", "ref": "マタイ 6:4" },
  { "category": "work", "keywords": ["忠実", "小さいこと", "信頼"], "text": "ごく小さな事に忠実な人は、大きな事にも忠実であり、不忠実な人は大きな事にも不忠実です。", "ref": "ルカ 16:10" },
  { "category": "work", "keywords": ["真理", "自由", "本質"], "text": "あなたがたは真理を知り、真理はあなたがたを自由にします。", "ref": "ヨハネ 8:32" },
  { "category": "work", "keywords": ["熱心", "仕える", "情熱"], "text": "熱心で、うむことなく、霊に燃え、主に仕えなさい。", "ref": "ローマ 12:11" },
  { "category": "work", "keywords": ["管理者", "責任", "誠実"], "text": "管理者に要求されることは、忠実だ、と認められることです。", "ref": "1コリント 4:2" },
  { "category": "work", "keywords": ["目的", "栄光", "理由"], "text": "食べるにも、飲むにも、何をするにも、ただ神の栄光のためにしなさい。", "ref": "1コリント 10:31" },
  { "category": "work", "keywords": ["役割", "チーム", "必要"], "text": "目に向かって「必要ない」と言うことはできないし、頭も足に向かって「必要ない」と言うことはできません。", "ref": "1コリント 12:21" },
  { "category": "work", "keywords": ["秩序", "適切", "整理"], "text": "すべてのことを、適切に、秩序正しく行いなさい。", "ref": "1コリント 14:40" },
  { "category": "work", "keywords": ["堅実", "動じない", "無駄じゃない"], "text": "堅く立って、動かされることなく、いつも主のわざに励みなさい。", "ref": "1コリント 15:58" },
  { "category": "work", "keywords": ["機会", "時間", "活用"], "text": "機会を十分に生かして用いなさい。悪い時代だからです。", "ref": "エペソ 5:16" },
  { "category": "work", "keywords": ["本心", "心から", "奉仕"], "text": "うわべだけの奉仕ではなく、キリストのしもべとして、心から神のみこころを行いなさい。", "ref": "エペソ 6:6" },
  { "category": "work", "keywords": ["すべて", "主", "仕事"], "text": "何をするにも、人に対してではなく、主に仕えるように、心からしなさい。", "ref": "コロサイ 3:23" },
  { "category": "work", "keywords": ["会話", "知恵", "対応"], "text": "あなたがたの会話は、いつも慈しみに満ちた、塩で味つけされたものでありなさい。", "ref": "コロサイ 4:6" },
  { "category": "work", "keywords": ["落ち着き", "仕事", "自立"], "text": "落ち着いた生活をし、自分の仕事に励み、自分の手で働きなさい。", "ref": "1テサロニケ 4:11" },
  { "category": "work", "keywords": ["働く", "規律", "怠惰"], "text": "働きたくない者は、食べることもしてはならない。", "ref": "2テサロニケ 3:10" },
  { "category": "work", "keywords": ["報酬", "給料", "権利"], "text": "聖書に「働き人が報酬を受けるのは当然である」と言われているからです。", "ref": "1テモテ 5:18" },
  { "category": "work", "keywords": ["熟練", "恥じない", "真理"], "text": "あなたは、熟練した者、恥じるところのない働き人として、自分を神にささげるように励みなさい。", "ref": "2テモテ 2:15" },
  { "category": "work", "keywords": ["準備", "良い業", "スタンバイ"], "text": "支配者と権威とに服従し、すべての良いわざをなす準備ができていなさい。", "ref": "テトス 3:1" },
  { "category": "work", "keywords": ["実行", "行動", "実行"], "text": "みことばを行う人になりなさい。自分を欺いて、ただ聞くだけの者となってはいけません。", "ref": "ヤコブ 1:22" },
  { "category": "relation", "keywords": ["平和", "子供", "仲介"], "text": "平和をつくる者は幸いです。その人たちは神の子供と呼ばれるからです。", "ref": "マタイ 5:9" },
  { "category": "relation", "keywords": ["敵", "祈り", "愛"], "text": "自分の敵を愛し、自分を迫害する者のために祈りなさい。", "ref": "マタイ 5:44" },
  { "category": "relation", "keywords": ["黄金律", "ルール", "相手"], "text": "何事でも、自分にしてもらいたいことは、ほかの人にもそのようにしなさい。", "ref": "マタイ 7:12" },
  { "category": "relation", "keywords": ["赦し", "何度でも", "リセット"], "text": "「七回を七十倍するまで赦しなさい。」", "ref": "マタイ 18:22" },
  { "category": "relation", "keywords": ["仕える", "リーダー", "謙虚"], "text": "あなたがたの間で偉くなりたいと思う者は、みなに仕える者になりなさい。", "ref": "マルコ 10:43" },
  { "category": "relation", "keywords": ["裁かない", "批判", "ブーメラン"], "text": "人をさばくな。そうすれば自分もさばかれません。人を罪に定めるな。そうすれば自分も罪に定められません。", "ref": "ルカ 6:37" },
  { "category": "relation", "keywords": ["愛", "掟", "互いに"], "text": "わたしがあなたがたを愛したように、あなたがたも互いに愛し合いなさい。", "ref": "ヨハネ 13:34" },
  { "category": "relation", "keywords": ["友", "犠牲", "最高"], "text": "人がその友のためにいのちを捨てるという、これよりも大きな愛はだれも持っていません。", "ref": "ヨハネ 15:13" },
  { "category": "relation", "keywords": ["尊敬", "優先", "敬い"], "text": "兄弟愛をもって互いに深く慈しみ、相手を自分より優れた者として敬いなさい。", "ref": "ローマ 12:10" },
  { "category": "relation", "keywords": ["共感", "泣く", "笑う"], "text": "喜ぶ者とともに喜び、泣く者とともに泣きなさい。", "ref": "ローマ 12:15" },
  { "category": "relation", "keywords": ["平和", "努力", "全方位"], "text": "できるならば、自分側から、すべての人と平和を保ちなさい。", "ref": "ローマ 12:18" },
  { "category": "relation", "keywords": ["一致", "心", "チームワーク"], "text": "みな同じことを語り、あなたがたの間に分裂のないようにしなさい。", "ref": "1コリント 1:10" },
  { "category": "relation", "keywords": ["愛", "忍耐", "親切"], "text": "愛は寛容であり、愛は親切です。また人をねたみません。愛は自慢せず、高ぶりません。", "ref": "1コリント 13:4" },
  { "category": "relation", "keywords": ["重荷", "助け合い", "シェア"], "text": "互いの重荷を負い合いなさい。それによって、キリストの律法を全うするのです。", "ref": "ガラテヤ 6:2" },
  { "category": "relation", "keywords": ["寛容", "我慢", "愛"], "text": "愛のゆえに互いに忍び合いなさい。", "ref": "エペソ 4:2" },
  { "category": "relation", "keywords": ["言葉", "徳", "恵み"], "text": "悪いことばをいっさい口から出してはいけません。徳を高めるのに役に立つことばを語りなさい。", "ref": "エペソ 4:29" },
  { "category": "relation", "keywords": ["親切", "赦し", "優しさ"], "text": "互いに親切にし、赦し合いなさい。神がキリストにおいてあなたがたを赦してくださったように。", "ref": "エペソ 4:32" },
  { "category": "relation", "keywords": ["謙遜", "他者評価", "自己中心"], "text": "何事も利己的な思いからするのではなく、謙遜になって、互いに人を自分よりもすぐれた者と思いなさい。", "ref": "ピリピ 2:3" },
  { "category": "relation", "keywords": ["励まし", "向上", "ポジティブ"], "text": "互いに励まし合い、高め合いなさい。", "ref": "1テサロニケ 5:11" },
  { "category": "relation", "keywords": ["聞く", "話す", "怒り"], "text": "だれでも、聞くのに早く、語るのに遅く、怒るのに遅くありなさい。", "ref": "ヤコブ 1:19" },
  { "category": "self", "keywords": ["価値", "髪の毛", "数えられている"], "text": "あなたがたの頭の毛までも、みな数えられています。だから恐れることはありません。", "ref": "マタイ 10:30-31" },
  { "category": "self", "keywords": ["子供", "特権", "受け入れる"], "text": "しかし、この方を受け入れた人々には、神の子供となる特権をお与えになった。", "ref": "ヨハネ 1:12" },
  { "category": "self", "keywords": ["選ばれた", "任命", "実"], "text": "あなたがたがわたしを選んだのではなく、わたしがあなたがたを選び、任命したのです。", "ref": "ヨハネ 15:16" },
  { "category": "self", "keywords": ["新しい", "命", "洗礼"], "text": "私たちはキリストとともに葬られたのです。…新しいいのちに歩むためです。", "ref": "ローマ 6:4" },
  { "category": "self", "keywords": ["神の子", "導き", "霊"], "text": "神の御霊に導かれる人は、だれでも神の子供です。", "ref": "ローマ 8:14" },
  { "category": "self", "keywords": ["勝利", "圧倒的", "愛"], "text": "私たちは、私たちを愛してくださった方によって、圧倒的な勝利者となるのです。", "ref": "ローマ 8:37" },
  { "category": "self", "keywords": ["宮", "聖霊", "尊い"], "text": "あなたがたは神の宮であり、神の御霊があなたがたの内に宿っておられることを、知らないのですか。", "ref": "1コリント 3:16" },
  { "category": "self", "keywords": ["賜物", "個性", "恵み"], "text": "私は、神の恵みによって、今の私になりました。", "ref": "1コリント 15:10" },
  { "category": "self", "keywords": ["変えられる", "栄光", "鏡"], "text": "私たちはみな、鏡のように主の栄光を反映させながら、主と同じ姿に変えられていきます。", "ref": "2コリント 3:18" },
  { "category": "self", "keywords": ["土の器", "宝", "力"], "text": "私たちは、この宝を土の器の中に入れています。この力が神のものであることが明らかになるためです。", "ref": "2コリント 4:7" },
  { "category": "self", "keywords": ["内なる人", "日々", "更新"], "text": "たとい私たちの外なる人は衰えても、内なる人は日々新しくされています。", "ref": "2コリント 4:16" },
  { "category": "self", "keywords": ["新しい創造", "リセット", "過去"], "text": "だれでもキリストにあるならば、その人は新しく造られた者です。すべてが新しくなりました。", "ref": "2コリント 5:17" },
  { "category": "self", "keywords": ["自由", "解放", "くびき"], "text": "キリストは、自由を得させるために、私たちを解放してくださいました。", "ref": "ガラテヤ 5:1" },
  { "category": "self", "keywords": ["選定", "聖なる", "傷がない"], "text": "神は世界の基が置かれる前から、キリストにあって私たちを選び、聖なる者にしようとされたのです。", "ref": "エペソ 1:4" },
  { "category": "self", "keywords": ["作品", "傑作", "良い行い"], "text": "私たちは神の作品であって、良い行いをするためにキリスト・イエスにあって造られたのです。", "ref": "エペソ 2:10" },
  { "category": "self", "keywords": ["国籍", "天", "市民"], "text": "私たちの国籍は天にあります。", "ref": "ピリピ 3:20" },
  { "category": "self", "keywords": ["力", "できる", "強さ"], "text": "私は、私を強くしてくださる方によって、どんなことでもできるのです。", "ref": "ピリピ 4:13" },
  { "category": "self", "keywords": ["愛される", "選ばれた", "聖なる"], "text": "あなたがたは神に選ばれた者、聖なる、愛されている者です。", "ref": "コロサイ 3:12" },
  { "category": "self", "keywords": ["王", "祭司", "所有"], "text": "あなたがたは選ばれた種族、王である祭司、聖なる国民、神の所有とされた民です。", "ref": "1ペテロ 2:9" },
  { "category": "self", "keywords": ["愛", "神の子", "呼ばれる"], "text": "私たちが神の子供と呼ばれるために、御父がどんなにすばらしい愛を与えてくださったかを考えなさい。", "ref": "1ヨハネ 3:1" },
  { "category": "future", "keywords": ["探す", "門", "開く"], "text": "求めなさい、そうすれば与えられます。探しなさい、そうすれば見つかります。", "ref": "マタイ 7:7" },
  { "category": "future", "keywords": ["狭い門", "道", "命"], "text": "狭い門から入りなさい。いのちに至る門は小さく、それを見いだす者はまれです。", "ref": "マタイ 7:13-14" },
  { "category": "future", "keywords": ["道", "真理", "命"], "text": "イエスは彼に言われた。「わたしが道であり、真理であり、いのちなのです。」", "ref": "ヨハネ 14:6" },
  { "category": "future", "keywords": ["報い", "忍耐", "永遠"], "text": "忍耐して善を行い、栄光を求める者には、永遠のいのちを与え…。", "ref": "ローマ 2:7" },
  { "category": "future", "keywords": ["希望", "失望", "愛"], "text": "この希望は失望に終わることがありません。", "ref": "ローマ 5:5" },
  { "category": "future", "keywords": ["導き", "神の子", "霊"], "text": "神の御霊に導かれる人は、だれでも神の子供です。", "ref": "ローマ 8:14" },
  { "category": "future", "keywords": ["知恵", "深さ", "知識"], "text": "ああ、神の知恵と知識の富は、なんと深いことでしょう。", "ref": "ローマ 11:33" },
  { "category": "future", "keywords": ["変えられる", "心", "御心"], "text": "心を新たにすることで自分を変えなさい。そうすれば、神の御心が何であるかがわかります。", "ref": "ローマ 12:2" },
  { "category": "future", "keywords": ["希望", "喜び", "力"], "text": "望みの神が、あなたがたを喜びと平安で満たし、望みにあふれさせてくださいますように。", "ref": "ローマ 15:13" },
  { "category": "future", "keywords": ["目", "耳", "心"], "text": "目がまだ見ず、耳がまだ聞かず、人の心に思い浮かびもしなかったことを、神は備えられた。", "ref": "1コリント 2:9" },
  { "category": "future", "keywords": ["歩み", "信仰", "見えるもの"], "text": "私たちは、見えるものによらず、信仰によって歩むからです。", "ref": "2コリント 5:7" },
  { "category": "future", "keywords": ["完成", "確信", "始まり"], "text": "あなたがたの内に良いわざを始められた方は、それを完成させてくださると確信しています。", "ref": "ピリピ 1:6" },
  { "category": "future", "keywords": ["目標", "賞", "走る"], "text": "私は、目標を目ざして一心に走っているのです。", "ref": "ピリピ 3:14" },
  { "category": "future", "keywords": ["望み", "天", "福音"], "text": "あなたがたのために天に蓄えられている望みのゆえです。", "ref": "コロサイ 1:5" },
  { "category": "future", "keywords": ["約束", "誠実", "真実"], "text": "約束された方は真実な方ですから、動揺しないようにしましょう。", "ref": "ヘブル 10:23" },
  { "category": "future", "keywords": ["信仰", "保証", "確信"], "text": "信仰は望んでいる事がらを保証し、目に見えないものを確信させるものです。", "ref": "ヘブル 11:1" },
  { "category": "future", "keywords": ["都", "永遠", "探し求める"], "text": "私たちは、この地上に永遠の都を持たず、きたるべき都を探し求めているのです。", "ref": "ヘブル 13:14" },
  { "category": "future", "keywords": ["知恵", "願い", "与える"], "text": "あなたがたの中に知恵の欠けた人がいるなら、だれにでも与えてくださる神に願いなさい。", "ref": "ヤコブ 1:5" },
  { "category": "future", "keywords": ["計画", "主の御心", "生きる"], "text": "あなたがたは、「主のみこころであれば、私たちは生き、このことをしよう」と言うべきです。", "ref": "ヤコブ 4:15" },
  { "category": "future", "keywords": ["永遠", "御心", "過ぎ去る"], "text": "世と世の欲は過ぎ去ります。しかし、神のみこころを行う者は永遠に生き続けます。", "ref": "1ヨハネ 2:17" },
  { "category": "life", "keywords": ["空の鳥", "養う", "価値"], "text": "空の鳥を見なさい。種蒔きもせず刈り入れもしません。しかし、天の父は養ってくださいます。", "ref": "マタイ 6:26" },
  { "category": "life", "keywords": ["必要", "第一に", "求める"], "text": "神の国とその義とをまず第一に求めなさい。そうすれば、これらのものはすべて与えられます。", "ref": "マタイ 6:33" },
  { "category": "life", "keywords": ["宝", "天", "心"], "text": "自分の宝を地上にたくわえてはいけません。自分の宝を天にたくわえなさい。", "ref": "マタイ 6:19-20" },
  { "category": "life", "keywords": ["二人の主人", "富", "神"], "text": "あなたがたは、神と富との両方に仕えることはできません。", "ref": "マタイ 6:24" },
  { "category": "life", "keywords": ["家", "岩", "嵐"], "text": "雨が降り川があふれても倒れませんでした。岩の上に土台が据えられていたからです。", "ref": "マタイ 7:25" },
  { "category": "life", "keywords": ["貪欲", "命", "持ち物"], "text": "人のいのちは、持ち物がいかに豊かであるかということにあるのではないからです。", "ref": "ルカ 12:15" },
  { "category": "life", "keywords": ["苦難", "忍耐", "練達"], "text": "患難が忍耐を生み出し、忍耐が練られた品性を生み出し、希望を生み出す。", "ref": "ローマ 5:3-4" },
  { "category": "life", "keywords": ["苦しみ", "栄光", "比較"], "text": "現在の苦しみは、将来現される栄光に比べれば、取るに足りないものだと私は考えます。", "ref": "ローマ 8:18" },
  { "category": "life", "keywords": ["試練", "脱出", "耐える"], "text": "神は真実な方ですから、あなたがたを耐えられないほどの試練に会わせることはなさいません。", "ref": "1コリント 10:13" },
  { "category": "life", "keywords": ["一時的", "永遠", "重み"], "text": "今の時の軽い患難は、測り知れない、重い永遠の栄光をもたらすからです。", "ref": "2コリント 4:17" },
  { "category": "life", "keywords": ["種まき", "刈り取り", "法則"], "text": "人は自分の蒔いたものを、また刈り取ることになるのです。", "ref": "ガラテヤ 6:7" },
  { "category": "life", "keywords": ["欠乏", "豊かさ", "秘訣"], "text": "私は、貧しさの中にいる道も知っており、豊かさの中にいる道も知っています。", "ref": "ピリピ 4:12" },
  { "category": "life", "keywords": ["必要", "満たす", "供給"], "text": "私の神は、キリスト・イエスにあるご自身の栄光の富をもって、必要をすべて満たしてくださいます。", "ref": "ピリピ 4:19" },
  { "category": "life", "keywords": ["満足", "敬虔", "利益"], "text": "満ち足りる心を伴う敬虔こそ、大きな利益を受ける道です。", "ref": "1テモテ 6:6" },
  { "category": "life", "keywords": ["持ち込み", "持ち出し", "裸"], "text": "私たちは何一つこの世に持って来なかったし、何一つ持って出ることもできません。", "ref": "1テモテ 6:7" },
  { "category": "life", "keywords": ["金銭欲", "悪", "迷い"], "text": "金銭を愛することが、あらゆる悪の根です。", "ref": "1テモテ 6:10" },

        let currentVerseText = "";
        let currentVerseRef = "";

        // ▼ 完全ランダム表示（おまかせボタン）
        function searchRandom() {
            const result = bibleVerses[Math.floor(Math.random() * bibleVerses.length)];
            displayModal(result);
        }

        // ▼ キーワード検索（虫眼鏡 or Enterキー）
        function performKeywordSearch() {
            const input = document.getElementById('userInput').value.trim();
            let result;

            if (input) {
                const matched = bibleVerses.filter(v => 
                    v.keywords.some(k => k.includes(input)) || 
                    v.text.includes(input)
                );
                
                if (matched.length > 0) {
                    result = matched[Math.floor(Math.random() * matched.length)];
                } else {
                    result = { 
                        text: "そのキーワードに合う言葉が見つかりませんでした。代わりに一つ処方します。", 
                        ref: "御言葉サプリ" 
                    };
                }
                displayModal(result);
            } else {
                // 入力なしで虫眼鏡を押した場合はランダム
                searchRandom();
            }
        }

        function filterByCategory(category) {
            const filtered = bibleVerses.filter(v => v.category === category);
            if (filtered.length > 0) {
                displayModal(filtered[Math.floor(Math.random() * filtered.length)]);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                performKeywordSearch();
            }
        }

        async function displayModal(verse) {
            const textEl     = document.getElementById('modalText');
            const refEl      = document.getElementById('modalRef');
            const iconEl     = document.querySelector('.verse-icon');
            const shareEl    = document.getElementById('shareButtons');
            const speakRowEl = document.getElementById('speakRow');
            const overlay    = document.getElementById('modalOverlay');
            const card       = document.querySelector('.modal-card');
            const badge      = document.getElementById('gachaBadge');
            const rays       = document.getElementById('heavenRays');

            currentVerseText = verse.text;
            currentVerseRef  = verse.ref;

            // リセット
            [iconEl, textEl, refEl, shareEl, speakRowEl].forEach(el => {
                el.classList.remove('animate-in');
                el.style.opacity = '0';
            });
            card.style.animation  = 'none';
            card.style.opacity    = '';   // インラインをクリア → CSS の opacity:0 が効く
            rays.style.animation  = 'none';
            rays.style.opacity    = '0';
            badge.textContent     = '';
            void card.offsetHeight;

            if (window.speechSynthesis) speechSynthesis.cancel();
            updateSpeakBtn(false);

            textEl.innerText = verse.text;
            refEl.innerText  = verse.ref;

            overlay.classList.add('active');
            await new Promise(r => setTimeout(r, 30));

            // ── 天から舞い降りる ──
            card.style.animation = 'fallFromHeaven 1.3s cubic-bezier(0.15, 0.8, 0.3, 1) forwards';

            await new Promise(r => setTimeout(r, 1000));

            // 着地！ 光芒 + ゴールドグロー + パーティクル + シャイン
            void rays.offsetHeight;
            rays.style.opacity   = '1';
            rays.style.animation = 'rayPulse 0.85s ease-out forwards';

            card.style.opacity   = '1';   // landGlow 切替時に opacity を維持
            card.style.animation = 'landGlow 1.2s ease-out forwards';
            badge.textContent    = '✨ みことばが届きました';

            burstParticles();
            addShine(card);

            setTimeout(() => iconEl.classList.add('animate-in'),    80);
            setTimeout(() => textEl.classList.add('animate-in'),   260);
            setTimeout(() => refEl.classList.add('animate-in'),    560);
            setTimeout(() => speakRowEl.classList.add('animate-in'), 760);
            setTimeout(() => shareEl.classList.add('animate-in'),  940);
        }

        function closeModal(event) {
            if (event.target.id === 'modalOverlay') closeModalButton();
        }

        function closeModalButton() {
            const overlay = document.getElementById('modalOverlay');
            const card    = document.querySelector('.modal-card');
            overlay.classList.remove('active');
            card.style.animation = 'none';
            card.style.opacity   = '0';
            if (window.speechSynthesis) speechSynthesis.cancel();
            updateSpeakBtn(false);
        }

        function burstParticles() {
            const overlay = document.getElementById('modalOverlay');
            const card    = document.querySelector('.modal-card');
            const oRect   = overlay.getBoundingClientRect();
            const cRect   = card.getBoundingClientRect();
            const cx = cRect.left - oRect.left + cRect.width  / 2;
            const cy = cRect.top  - oRect.top  + cRect.height / 2;
            const colors = ['#d4a373','#e9c46a','#8ba382','#f4a261','#a8d5a2','#fffde7','#ffffff'];
            for (let i = 0; i < 26; i++) {
                const p     = document.createElement('div');
                p.className = 'particle';
                const angle = (i / 26) * Math.PI * 2;
                const dist  = 65 + Math.random() * 120;
                const tx    = Math.cos(angle) * dist;
                const ty    = Math.sin(angle) * dist;
                const size  = 5 + Math.random() * 8;
                p.style.cssText = `left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;background:${colors[i % colors.length]};--tx:${tx}px;--ty:${ty}px;`;
                overlay.appendChild(p);
                setTimeout(() => p.remove(), 850);
            }
        }

        function addShine(container) {
            const wrap  = document.createElement('div');
            wrap.className = 'card-shine-wrap';
            const shine = document.createElement('div');
            shine.className = 'card-shine';
            wrap.appendChild(shine);
            container.appendChild(wrap);
            setTimeout(() => wrap.remove(), 750);
        }

        // ── 音読（聖句テキストのみ） ──
        function speakVerse() {
            if (!window.speechSynthesis) {
                showToast('このブラウザは音読に未対応です');
                return;
            }
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
                updateSpeakBtn(false);
                return;
            }
            const utterance = new SpeechSynthesisUtterance(currentVerseText);
            utterance.lang  = 'ja-JP';
            utterance.rate  = 0.82;
            utterance.pitch = 1.0;
            utterance.onstart = () => updateSpeakBtn(true);
            utterance.onend   = () => updateSpeakBtn(false);
            utterance.onerror = () => updateSpeakBtn(false);
            speechSynthesis.speak(utterance);
        }

        function updateSpeakBtn(isSpeaking) {
            const btn   = document.getElementById('speakBtn');
            const label = document.querySelector('.speak-label');
            if (!btn) return;
            btn.classList.toggle('speaking', isSpeaking);
            if (label) label.textContent = isSpeaking ? '停止する' : '音読する';
        }

        function shareAction(type) {
            const shareText = `${currentVerseText}\n（${currentVerseRef}）\n\n#御言葉サプリ #心の処方箋`;
            const encodedText = encodeURIComponent(shareText);

            if (type === 'copy') {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(shareText).then(() => showToast("コピーしました📋"))
                    .catch(() => fallbackCopy(shareText));
                } else {
                    fallbackCopy(shareText);
                }
            } else if (type === 'x') {
                window.open(`https://twitter.com/intent/tweet?text=${encodedText}`, '_blank');
            } else if (type === 'line') {
                window.open(`https://line.me/R/msg/text/?${encodedText}`, '_blank');
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); showToast("コピーしました📋"); } catch (err) {}
            document.body.removeChild(textArea);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
